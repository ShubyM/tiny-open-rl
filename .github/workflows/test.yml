name: Tests
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install redis and dependencies
      run: |
        curl -fsSL https://packages.redis.io/gpg | sudo gpg --dearmor -o /usr/share/keyrings/redis-archive-keyring.gpg
        echo "deb [signed-by=/usr/share/keyrings/redis-archive-keyring.gpg] https://packages.redis.io/deb $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/redis.list
        sudo apt-get update && sudo apt-get install -y redis
        redis-server --version
        pip install torch --index-url https://download.pytorch.org/whl/cpu
        pip install -e ".[testing]" tinker
    - name: Lint
      run: |
        ruff check .
        ruff format --check .
    - name: Line count
      run: MAX_LINE_COUNT=800 python sz.py
    - name: Test
      run: TINKER_PYTHON=$(which python) python -m unittest discover -s test -t . -v
