apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  replicas: 2
  selector:
    matchLabels: {app: gateway}
  template:
    metadata:
      labels: {app: gateway}
    spec:
      containers:
      - name: gateway
        image: tinyrl
        command: ["python3", "-m", "tinyrl.api.gateway"]
        envFrom:
        - configMapRef: {name: tinyrl}
        ports:
        - containerPort: 8000
        readinessProbe:
          httpGet: {path: /api/v1/healthz, port: 8000}
        resources:
          requests: {cpu: "1", memory: 2Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  selector: {app: gateway}
  ports:
  - port: 8000
