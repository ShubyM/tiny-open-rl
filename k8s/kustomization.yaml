apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: tinyrl
resources:
- namespace.yaml
- gateway.yaml
- node-daemon.yaml
configMapGenerator:
- name: tinyrl
  literals:
  - CONTROL_URL=http://gateway:8000
  - CKPT=gs://YOUR_BUCKET/ckpt
  - CKPT_CACHE=/dev/shm/tinyrl-cache
images:
- name: tinyrl
  newName: YOUR_REGISTRY/tinyrl
  newTag: latest
