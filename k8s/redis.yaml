# One Redis with an append-only file on a persistent disk: runs, sessions, leases and parked runs survive a restart.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels: {app: redis}
  template:
    metadata:
      labels: {app: redis}
    spec:
      securityContext: {fsGroup: 1000}  # the redis user's group, so it can write the persistent disk
      containers:
      - name: redis
        image: redis:8.6-alpine
        args: ["--appendonly", "yes", "--appendfsync", "everysec", "--save", ""]
        ports:
        - containerPort: 6379
        readinessProbe:
          exec:
            command: ["redis-cli", "ping"]
        volumeMounts:
        - {name: data, mountPath: /data}
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: [ReadWriteOnce]
      resources:
        requests: {storage: 10Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector: {app: redis}
  ports:
  - port: 6379
