[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tinyrl"
version = "0.2.0"
description = "The Tinker training API on Redis Streams and PyTorch."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["fastapi", "uvicorn", "redis>=5", "protobuf>=5", "numpy", "torch", "transformers>=5", "peft>=0.15", "safetensors"]

[project.optional-dependencies]
testing = ["httpx", "ruff", "tabulate"]

[tool.setuptools.packages.find]
include = ["tinyrl*"]

[tool.ruff]
target-version = "py311"
line-length = 120
indent-width = 2
exclude = ["tinyrl/proto"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
  "B008",  # FastAPI declares headers as default arguments
  "B905",  # zip(strict=) on zips whose lengths match by construction is noise
]
